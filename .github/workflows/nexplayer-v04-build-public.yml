name: NexPlayer V0.4 Android Build Public

on:
  push:
    branches: [nexplayer-ci-v04]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact NexPlayer source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          p=pathlib.Path('ci_payload')
          def r(n): return (p/n).read_text()
          def repl(s, off, patch):
              assert len(patch)==1000
              return s[:off]+patch+s[off+1000:]
          q03=repl(r('q03'),3000,r('patch_q03_3000'))
          q04=repl(r('q04'),13000,r('patch_q04_13000'))
          q05a=repl(r('q05a_exact'),5000,r('patch_q05a_5000'))
          q05b=r('q05b_exact')[:2000] + ''.join(r(f'patch_q05b_{i}') for i in range(2000,8000,1000))
          q05=q05a+q05b
          q07=r('q07a_exact')+r('q07b_exact')
          q08=repl(r('q08'),6000,r('patch_q08_6000'))
          b64=''.join([r('p00'),r('q00'),r('q01'),r('q02'),q03,q04,q05,r('q06'),q07,q08,r('q09'),r('q10')])
          assert len(b64)==170504, len(b64)
          raw=base64.b64decode(b64, validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          print('archive sha256:',sha)
          expected='3edb07fcec024ded71285a05aa294b4563d603074f8dfccc5ea8f549a6b942fb'
          assert sha==expected, (sha,expected)
          pathlib.Path('NexPlayer-v0.4-source.zip').write_bytes(raw)
          PY
          mkdir -p nexplayer
          unzip -q NexPlayer-v0.4-source.zip -d nexplayer

      - name: Patch source build issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('nexplayer/app/build.gradle')
          s = gradle.read_text()
          old = "    implementation 'com.github.NorthernCaptain:TAndroidLame:1.1'"
          new = "    implementation('com.github.NorthernCaptain:TAndroidLame:1.1') {\n        exclude group: 'com.android.support'\n    }"
          if old not in s:
              raise SystemExit('TAndroidLame dependency line not found')
          gradle.write_text(s.replace(old, new))

          manifest = Path('nexplayer/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">'
          )
          m = m.replace(
              '        android:allowBackup="false"',
              '        android:allowBackup="false"\n        tools:replace="android:allowBackup"'
          )
          manifest.write_text(m)

          main_layout = Path('nexplayer/app/src/main/res/layout/activity_main.xml')
          x = main_layout.read_text().replace(' android:selected="true"', '')
          main_layout.write_text(x)

          online = Path('nexplayer/app/src/main/java/tech/nextech/nexplayer/OnlineToolsActivity.java')
          o = online.read_text()
          o = o.replace(r'name.replaceFirst("\.[^.]+$","")', r'name.replaceFirst("\\.[^.]+$","")')
          o = o.replace(r'replaceFirst("\.media$","")', r'replaceFirst("\\.media$","")')
          online.write_text(o)

          player = Path('nexplayer/app/src/main/java/tech/nextech/nexplayer/PlayerActivity.java')
          p = player.read_text()
          p = p.replace(r'matches(".*\.(mp3|m4a|aac|flac|wav|ogg)(\?.*)?$")', r'matches(".*\\.(mp3|m4a|aac|flac|wav|ogg)(\\?.*)?$")')
          player.write_text(p)

          hls = Path('nexplayer/app/src/main/java/tech/nextech/nexplayer/util/HlsOfflineDownloader.java')
          h = hls.read_text()
          if 'j<lines.length()' not in h:
              raise SystemExit('Expected HLS array length issue not found')
          hls.write_text(h.replace('j<lines.length()', 'j<lines.length'))
          PY
          grep -n 'j<lines.length' nexplayer/app/src/main/java/tech/nextech/nexplayer/util/HlsOfflineDownloader.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build NexPlayer debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p nexplayer :app:assembleDebug --stacktrace --no-daemon
          test -f nexplayer/app/build/outputs/apk/debug/app-debug.apk
          sha256sum nexplayer/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexPlayer-v0.4-debug-apk
          path: nexplayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
