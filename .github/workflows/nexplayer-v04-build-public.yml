name: NexPlayer V0.4 Android Build Public

on:
  push:
    branches: [nexplayer-ci-v04]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact NexPlayer source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          p=pathlib.Path('ci_payload')
          def r(n): return (p/n).read_text()
          def repl(s, off, patch):
              assert len(patch)==1000
              return s[:off]+patch+s[off+1000:]
          q03=repl(r('q03'),3000,r('patch_q03_3000'))
          q04=repl(r('q04'),13000,r('patch_q04_13000'))
          q05a=repl(r('q05a_exact'),5000,r('patch_q05a_5000'))
          q05b=r('q05b_exact')[:2000] + ''.join(r(f'patch_q05b_{i}') for i in range(2000,8000,1000))
          q05=q05a+q05b
          q07=r('q07a_exact')+r('q07b_exact')
          q08=repl(r('q08'),6000,r('patch_q08_6000'))
          b64=''.join([r('p00'),r('q00'),r('q01'),r('q02'),q03,q04,q05,r('q06'),q07,q08,r('q09'),r('q10')])
          assert len(b64)==170504, len(b64)
          raw=base64.b64decode(b64, validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          print('archive sha256:',sha)
          expected='3edb07fcec024ded71285a05aa294b4563d603074f8dfccc5ea8f549a6b942fb'
          assert sha==expected, (sha,expected)
          pathlib.Path('NexPlayer-v0.4-source.zip').write_bytes(raw)
          PY
          mkdir -p nexplayer
          unzip -q NexPlayer-v0.4-source.zip -d nexplayer

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build or diagnose resource conflict
        shell: bash
        run: |
          set +e
          gradle -p nexplayer :app:mergeDebugResources --stacktrace --no-daemon > build.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            cat build.log
            gradle -p nexplayer :app:assembleDebug --stacktrace --no-daemon
            exit $?
          fi
          echo '=== MERGE FAILURE SUMMARY ==='
          grep -E 'Duplicate value for resource|resource attr/actionBarSize|actionBarSize|FAILURE:|What went wrong' build.log | head -n 40 || true
          echo '=== MERGED VALUES OCCURRENCES ==='
          MERGED='nexplayer/app/build/intermediates/incremental/debug/mergeDebugResources/merged.dir/values/values.xml'
          if [ -f "$MERGED" ]; then
            grep -n -C 2 'actionBarSize' "$MERGED" | head -n 80 || true
          else
            echo 'merged values.xml not found'
          fi
          echo '=== MERGER.XML ORIGINS ==='
          find nexplayer/app/build/intermediates -name merger.xml -print | while read f; do
            if grep -q 'actionBarSize' "$f" 2>/dev/null; then
              echo "FILE=$f"
              grep -o '.\{0,180\}actionBarSize.\{0,180\}' "$f" | head -n 30 || true
            fi
          done
          echo '=== TRANSFORMED DEPENDENCY RESOURCE ORIGINS ==='
          grep -RIl 'name="actionBarSize"' "$HOME/.gradle/caches/8.9/transforms" 2>/dev/null | head -n 30 | while read f; do
            echo "FILE=$f"
            grep -n -C 1 'name="actionBarSize"' "$f" | head -n 10 || true
          done
          exit $RC

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexPlayer-v0.4-debug-apk
          path: nexplayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
